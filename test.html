<html lang="es">
    <head>
        <meta charset="utf-8">
        <title>Confirmacion con jQuery</title>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>   
        <script>
            //---------Funcion que obtiene parametros de la url---------//
            function getQueryVariable(variable) {
                var query = window.location.search.substring(1);
                var vars = query.split("&");
                for (var i=0; i < vars.length; i++) {
                    var pair = vars[i].split("=");
                    if(pair[0] == variable) {
                        return pair[1];
                    }
                }
                return false;
            } 

            var id=getQueryVariable('id');
            var clientTxId=getQueryVariable('clientTransactionId');

            $(document).ready(function() {
                $.ajax({
                    url: "https://pay.payphonetodoesposible.com/api/button/V2/Confirm",
                    type: "POST",
                    headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer KPkHSUBE3MayYNQdTbGfFBqFJLRF_--1yxfnZO8n1a5eHJhXNBgKmxSo55Jjv1S8b9gdx7Ue9CR8YmW3_68npKFt_E0ieb4QURAG5pBuXwD3lkzPGVCOGaNFgZURDzE5NMNZbeyfdtNGva-tjHbgP0XouggvJENOZC9y8_nCBMk5qrXCaFwNgPquFbxgG9AMiQtkqej41F8utWjlo74pShpqZmt008SlLnj61jBmtgFccYxPUAFTtKpaoOlXvHHJpPPY9BRgZ0eDlyL2oOJaqodqFznwFcGU7VMEAjLvgfIq7CpEJ32_Z6ohZQ3J5uyzpB1fsTse5WIKzBJw8Ug0cQPYNOk"
                    },
                    data: JSON.stringify({ 
                        "id": id,
                        "clientTxId": clientTxId
                    }),
                    success: function(response) {
                        $("#resultado").html(
                            "Respuesta : <pre>" + JSON.stringify(response, null, 2) + "</pre>"
                        );
                    },
                    error: function(error) {
                        $("#resultado").html(
                            "Error en la solicitud : <pre>" + JSON.stringify(error, null, 2) + "</pre>"
                        );
                    }
                });
            });
        </script>
    </head>    
    <body>
        <h1>Ejemplo de Solicitud POST con jQuery</h1>
        <div id="resultado"></div>
    
    </body>
</html>
